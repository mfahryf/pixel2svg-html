<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logo</title>
  <style>
    :root {
      --bg: #0a0c10;
      --card-bg: rgba(18, 22, 32, 0.75);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #stage-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 40px;
    }

    #svg-stage {
      max-width: 80vw;
      max-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.45));
      transition: transform 0.2s ease;
    }

    #svg-stage svg {
      width: 100%;
      height: auto;
      max-height: 70vh;
      display: block;
    }

    /* Injected Contextual Keyframes */
    
@keyframes mbg-ambient-wave {
  0%, 100% { transform: scale(0.85); opacity: 0.85; }
  50% { transform: scale(1.15); opacity: 1.0; }
}
svg > g, svg > circle, svg > path:not([id*="bg"]) {
  transform-box: fill-box;
  transform-origin: center;
  animation: mbg-ambient-wave 5.00s ease-in-out infinite;
}

    /* HUD Controls */
    #hud-panel {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 100;
    }

    .hud-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .subject-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .layer-badge {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border: 1px solid var(--border);
      text-transform: none;
      font-weight: 500;
    }

    .hud-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: var(--accent);
      color: #fff;
    }

    .hud-slider-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .hud-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 80px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      outline: none;
    }
    .hud-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    #fps-badge {
      font-family: monospace;
      font-size: 11px;
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>

    </div>
  </div>

  <div id="hud-panel">
    <div class="hud-meta">
      <div class="subject-title">
        Logo
        <span class="badge">BACKGROUND</span>
        <span id="fps-badge">60 FPS</span>
      </div>
      <div style="display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; max-width: 320px;">
        <span class="badge layer-badge">Background Elements (Spatial Wave)</span>
      </div>
    </div>

    <div class="hud-slider-group">
      <span>Speed</span>
      <input type="range" id="speed-slider" class="hud-slider" min="0.25" max="2.5" step="0.05" value="1.0">
      <span id="speed-val">1.0x</span>
    </div>

    <button id="toggle-play-btn" class="hud-btn">⏸ Pause</button>
    <button id="export-svg-btn" class="hud-btn">⬇ Export SVG</button>
  </div>

  <script>
    const stage = document.getElementById("svg-stage");
    const svgElem = stage.querySelector("svg");
    const speedSlider = document.getElementById("speed-slider");
    const speedVal = document.getElementById("speed-val");
    const togglePlayBtn = document.getElementById("toggle-play-btn");
    const exportBtn = document.getElementById("export-svg-btn");
    const fpsBadge = document.getElementById("fps-badge");

    // Real-time FPS Telemetry
    let frameCount = 0;
    let lastTime = performance.now();
    function trackFps(now) {
      frameCount++;
      if (now - lastTime >= 1000) {
        fpsBadge.textContent = `${frameCount} FPS`;
        frameCount = 0;
        lastTime = now;
      }
      requestAnimationFrame(trackFps);
    }
    requestAnimationFrame(trackFps);

    // Play / Pause Toggle
    let isPlaying = true;
    togglePlayBtn.addEventListener("click", () => {
      isPlaying = !isPlaying;
      const state = isPlaying ? "running" : "paused";
      svgElem.querySelectorAll("*").forEach(el => {
        el.style.animationPlayState = state;
      });
      togglePlayBtn.textContent = isPlaying ? "⏸ Pause" : "▶ Play";
    });

    // Speed Multiplier
    speedSlider.addEventListener("input", (e) => {
      const speed = parseFloat(e.target.value);
      speedVal.textContent = `${speed.toFixed(1)}x`;
      svgElem.querySelectorAll("*").forEach(el => {
        const computed = window.getComputedStyle(el);
        if (computed.animationDuration && computed.animationDuration !== "0s") {
          el.style.animationDuration = `${parseFloat(computed.animationDuration) / speed}s`;
        }
      });
    });

    // Export Standalone Animated SVG
    exportBtn.addEventListener("click", () => {
      const svgClone = svgElem.cloneNode(true);
      const styleEl = document.createElement("style");
      styleEl.textContent = `\n
@keyframes mbg-ambient-wave {
  0%, 100% { transform: scale(0.85); opacity: 0.85; }
  50% { transform: scale(1.15); opacity: 1.0; }
}
svg > g, svg > circle, svg > path:not([id*="bg"]) {
  transform-box: fill-box;
  transform-origin: center;
  animation: mbg-ambient-wave 5.00s ease-in-out infinite;
}\n`;
      svgClone.insertBefore(styleEl, svgClone.firstChild);

      const serializer = new XMLSerializer();
      const svgStr = serializer.serializeToString(svgClone);
      const blob = new Blob([svgStr], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Logo_motion.svg";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
