/* Hardware-Accelerated Contextual Motion */
/* Alternating Tidal Ripple Cascade */
@keyframes scallop-drift-right {
  0%, 100% { transform: translate(0px, 0px); }
  50% { transform: translate(24px, -4px); }
}
@keyframes scallop-drift-left {
  0%, 100% { transform: translate(0px, 0px); }
  50% { transform: translate(-24px, 4px); }
}
#row_1_mint, #row_3_yellow, #row_5_cyan, #row_7_lime {
  animation: scallop-drift-right 7.0s ease-in-out infinite;
}
#row_2_lavender, #row_4_pink, #row_6_peach, #row_8_blush {
  animation: scallop-drift-left 7.0s ease-in-out infinite;
}
