<svg viewBox="0 0 1200 800" width="1200" height="800" preserveAspectRatio="xMidYMid meet">
  <style>
/* Hardware-Accelerated Contextual Motion */
/* Harmonic Wave Swell &amp; Solar Pulse */
@keyframes sun-pulse {
  0%, 100% { transform: translateY(0px) scale(1.0); filter: drop-shadow(0 0 10px rgba(251, 195, 67, 0.45)); }
  50% { transform: translateY(-8px) scale(1.05); filter: drop-shadow(0 0 24px rgba(251, 195, 67, 0.85)); }
}
@keyframes wave-rear-drift {
  0%, 100% { transform: translate(0px, 0px); }
  50% { transform: translate(-14px, -6px); }
}
@keyframes wave-midhigh-drift {
  0%, 100% { transform: translate(0px, 0px); }
  50% { transform: translate(16px, 5px); }
}
@keyframes wave-mid-drift {
  0%, 100% { transform: translate(0px, 0px); }
  50% { transform: translate(-18px, -5px); }
}
@keyframes wave-midlow-drift {
  0%, 100% { transform: translate(0px, 0px); }
  50% { transform: translate(15px, 6px); }
}
@keyframes wave-fore-drift {
  0%, 100% { transform: translate(0px, 0px); }
  50% { transform: translate(-22px, -7px); }
}
#sun_disk {
  transform-box: fill-box;
  transform-origin: center;
  animation: sun-pulse 8.0s ease-in-out infinite;
}
#wave_rear {
  animation: wave-rear-drift 6.0s ease-in-out infinite;
}
#wave_mid_high {
  animation: wave-midhigh-drift 7.0s ease-in-out infinite;
}
#wave_mid {
  animation: wave-mid-drift 8.0s ease-in-out infinite;
}
#wave_mid_low {
  animation: wave-midlow-drift 6.5s ease-in-out infinite;
}
#wave_foreground {
  animation: wave-fore-drift 7.5s ease-in-out infinite;
}
</style><defs>
    
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6bafe0" />
      <stop offset="50%" stop-color="#4a92ca" />
      <stop offset="100%" stop-color="#245a8a" />
    </linearGradient>

    
    <linearGradient id="sky_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67bcf4" />
      <stop offset="45%" stop-color="#93cff6" />
      <stop offset="85%" stop-color="#d8ebfa" />
      <stop offset="100%" stop-color="#eaf3fb" />
    </linearGradient>

    
    <radialGradient id="sun_grad" cx="48%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#fbc343" />
      <stop offset="55%" stop-color="#f9a72b" />
      <stop offset="100%" stop-color="#e66f12" />
    </radialGradient>

    
    <linearGradient id="shadow_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123d66" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#1a4b7b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#255b8e" stop-opacity="0.0" />
    </linearGradient>

    
    <clipPath id="emblem_clip">
      <circle cx="600" cy="400" r="208" />
    </clipPath>
  </defs>

  
  <rect id="canvas_backdrop" width="1200" height="800" fill="url(#bg_grad)" />

  
  <g id="emblem_shadow">
    
    <path d="M 453 253 L 120 780 L 450 800 L 747 547 Z" fill="url(#shadow_grad)" />
    <circle cx="600" cy="400" r="208" fill="#123d66" opacity="0.25" filter="blur(14px)" />
  </g>

  
  <g id="emblem_art" clip-path="url(#emblem_clip)">
    
    <rect id="sky_backdrop" x="380" y="180" width="440" height="440" fill="url(#sky_grad)" />

    
    <circle id="sun_disk" cx="608" cy="340" r="73" fill="url(#sun_grad)" />

    
    <path id="wave_rear" d="M 380 372 C 430 358 480 398 535 390 C 585 382 615 352 660 352 C 710 352 745 395 820 380 L 820 620 L 380 620 Z" fill="#3897fa" />

    
    <path id="wave_mid_high" d="M 380 412 C 435 440 480 405 525 410 C 570 415 615 448 670 445 C 720 442 765 412 820 422 L 820 620 L 380 620 Z" fill="#1b6eeb" />

    
    <path id="wave_mid" d="M 380 460 C 440 445 490 485 550 480 C 605 475 645 435 700 440 C 745 445 780 482 820 472 L 820 620 L 380 620 Z" fill="#083ec0" />

    
    <path id="wave_mid_low" d="M 380 500 C 435 525 475 495 530 492 C 580 488 625 530 680 528 C 735 525 775 495 820 505 L 820 620 L 380 620 Z" fill="#2984f4" />

    
    <path id="wave_foreground" d="M 380 550 C 430 535 480 568 535 565 C 590 562 630 538 680 540 C 730 542 770 565 820 558 L 820 620 L 380 620 Z" fill="#0b379b" />
  </g>
</svg>