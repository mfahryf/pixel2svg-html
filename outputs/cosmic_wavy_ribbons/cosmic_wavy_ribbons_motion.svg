<svg viewBox="0 0 1920 960" width="1920" height="960" preserveAspectRatio="xMidYMid meet">
  <style>
/* Hardware-Accelerated Contextual Motion */
/* Cosmic Ribbon Flow &amp; Twinkling Stars */
@keyframes ribbon-flow-1 {
  0%, 100% { transform: translate(0px, 0px) scaleY(1.0); }
  50% { transform: translate(18px, -12px) scaleY(1.04); }
}
@keyframes ribbon-flow-2 {
  0%, 100% { transform: translate(0px, 0px) scaleY(1.0); }
  50% { transform: translate(-16px, 14px) scaleY(1.03); }
}
@keyframes star-twinkle {
  0%, 100% { transform: scale(0.75) rotate(0deg); opacity: 0.55; }
  50% { transform: scale(1.35) rotate(45deg); opacity: 1.0; filter: drop-shadow(0 0 12px rgba(255, 248, 240, 0.95)); }
}
@keyframes planet-orbital-float {
  0%, 100% { transform: translate(0px, 0px); }
  50% { transform: translate(8px, -16px); }
}
#ribbon_peach, #ribbon_magenta, #ribbon_mint {
  animation: ribbon-flow-1 8.0s ease-in-out infinite;
}
#ribbon_orange, #ribbon_teal {
  animation: ribbon-flow-2 7.0s ease-in-out infinite;
}
#celestial_stars {
  transform-origin: center;
  animation: star-twinkle 4.0s ease-in-out infinite;
}
#planet_orange_left, #planet_teal_top, #planet_magenta_lower, #planet_giant_navy_right {
  animation: planet-orbital-float 6.5s ease-in-out infinite;
}
</style><defs>
    
    <g id="star_template">
      <path d="M 0 -36 C 1 -10 10 -1 36 0 C 10 1 1 10 0 36 C -1 10 -10 1 -36 0 C -10 -1 -1 -10 0 -36 Z" fill="#fff8f0" />
    </g>

    
    <g id="small_star_template">
      <path d="M 0 -18 C 1 -5 5 -1 18 0 C 5 1 1 5 0 18 C -1 5 -5 1 -18 0 C -5 -1 -1 -5 0 -18 Z" fill="#fff8f0" />
    </g>
  </defs>

  
  <rect id="space_backdrop" width="1920" height="960" fill="#021d34" />

  
  <g id="celestial_stars">
    <use href="#star_template" x="110" y="140" transform="scale(1.1)" />
    <use href="#star_template" x="1775" y="310" transform="scale(1.2)" />
    <use href="#star_template" x="1320" y="285" transform="scale(0.8)" />
    <use href="#star_template" x="1570" y="550" transform="scale(0.9)" />
    <use href="#star_template" x="540" y="860" transform="scale(0.85)" />
    <use href="#star_template" x="1710" y="90" transform="scale(0.7)" />

    <use href="#small_star_template" x="205" y="265" />
    <use href="#small_star_template" x="325" y="60" />
    <use href="#small_star_template" x="90" y="830" />
    <use href="#small_star_template" x="635" y="905" />
    <use href="#small_star_template" x="1120" y="930" />
    <use href="#small_star_template" x="1170" y="945" />
  </g>

  
